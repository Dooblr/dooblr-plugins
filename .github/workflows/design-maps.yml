# Keeps design/INDEX.md and design/plugins/*.md in step with the plugin sources on main.
# Runs design/tools/update-design.py after every push that touches a plugin; if the generated
# blocks changed (for example a commit made without the pre-commit hook), commits them back.
# Separate from release.yml on purpose: it builds nothing and releases nothing.
name: design-maps

on:
  push:
    branches: [main]
    paths:
      - "dooblr-*/**"
      - "design/tools/**"
      - ".github/workflows/design-maps.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-maps
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the maps carry each plugin's last source-change date from git log

      - name: Regenerate design maps
        run: python3 design/tools/update-design.py --print-changed

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- design/; then
            echo "Design maps already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- design/INDEX.md design/plugins/
          git commit -m "design: regenerate plugin maps [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing on the new main."
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
